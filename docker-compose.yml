version: "3.9"

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["5000:5000"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/maneyindha
      REDIS_URL: redis://redis:6379
    depends_on: [mongo, redis]
    volumes:
      - ./backend/src:/app/src

volumes:
  mongo_data:
